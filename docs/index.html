        function loadD4Model() {

            var viewer = ws3d.viewer;

            var lon = 127.4764211;
            var lat = 34.9701045;

            // 지면 높이 가져오기
            var cartographic = Cesium.Cartographic.fromDegrees(lon, lat);
            var groundHeight = viewer.scene.globe.getHeight(cartographic);

            if (!Cesium.defined(groundHeight)) {
                groundHeight = 0;
            }

            var heightOffset = -20.5;

            var position = Cesium.Cartesian3.fromDegrees(
                lon,
                lat,
                groundHeight + heightOffset
            );

            // ★ 네가 맞춘 방향값
            var heading = Cesium.Math.toRadians(15);

            var hpr = new Cesium.HeadingPitchRoll(
                heading,
                0,
                0
            );

            var modelMatrix =
                Cesium.Transforms.headingPitchRollToFixedFrame(
                    position,
                    hpr
                );

            // ★ 이것만 조절하면 됨
            Cesium.Matrix4.multiplyByScale(
                modelMatrix,
                new Cesium.Cartesian3(
                    0.8,   // X : 가로
                    2.2,   // Y : 세로
                    1.0    // Z : 높이
                ),
                modelMatrix
            );

            var options = {
                url: "./assets/data/buildings/D4.glb",
                modelMatrix: modelMatrix,
                minimumPixelSize: 0
            };

            // VWorld에 들어있는 Cesium 버전에 맞춰 자동 선택
            if (Cesium.Model.fromGltfAsync) {

                Cesium.Model.fromGltfAsync(options)
                    .then(function (model) {
                        viewer.scene.primitives.add(model);
                        console.log("D4 로딩 완료");
                    })
                    .catch(function (error) {
                        console.error("D4 로딩 실패:", error);
                    });

            } else {

                var model = Cesium.Model.fromGltf(options);
                viewer.scene.primitives.add(model);

                console.log("D4 로딩 완료");
            }
        }

        function applyWhiteContext() {

            if (
                typeof Cesium === "undefined" ||
                typeof ws3d === "undefined" ||
                !ws3d.viewer
            ) {
                console.error("Cesium 또는 VWorld Viewer를 찾을 수 없습니다.");
                return;
            }

            // 중복 생성 방지
            if (window.scnuWhiteContextCreated) {
                return;
            }

            window.scnuWhiteContextCreated = true;

            var viewer = ws3d.viewer;
            var scene = viewer.scene;

            /*
            * 흰색으로 처리할 전체 범위
            * 순천대학교 주변을 충분히 넓게 설정
            */
            var outsidePositions = Cesium.Cartesian3.fromDegreesArray([
                127.4400, 34.9300,
                127.5300, 34.9300,
                127.5300, 35.0100,
                127.4400, 35.0100
            ]);

            /*
            * 원래 색상을 유지할 순천대학교 캠퍼스 영역
            * 이 부분이 흰색 폴리곤의 구멍이 됨
            */
            var campusPositions = Cesium.Cartesian3.fromDegreesArray([
                // 서쪽 경계
                127.4758141, 34.9697356,
                127.4758274, 34.9701379,
                127.4759191, 34.9705426,
                127.4761686, 34.9707547,

                // 북쪽 경계
                127.4772039, 34.9707564,
                127.4779345, 34.9710410,
                127.4784123, 34.9709491,
                127.4792176, 34.9711079,
                127.4796666, 34.9711468,
                127.4801387, 34.9709557,

                // 북동쪽 경계
                127.4807751, 34.9705095,
                127.4812968, 34.9702866,
                127.4818511, 34.9703939,
                127.4821450, 34.9706200,
                127.4826353, 34.9705200,
                127.4830280, 34.9706200,

                // 동쪽 경계
                127.4833976, 34.9702003,
                127.4836101, 34.9693224,
                127.4839489, 34.9682833,
                127.4841614, 34.9673974,
                127.4846108, 34.9658488,

                // 남쪽 경계
                127.4833937, 34.9654779,
                127.4828237, 34.9668157,
                127.4815146, 34.9666375,
                127.4803564, 34.9664593,
                127.4794261, 34.9662652,

                // 남서쪽·서쪽 복귀
                127.4789314, 34.9668427,
                127.4780003, 34.9671266,
                127.4773916, 34.9671796,
                127.4771528, 34.9674314,
                127.4772927, 34.9678869,
                127.4769713, 34.9680940,
                127.4767609, 34.9686619,
                127.4769488, 34.9689789,

                // 시작점으로 닫기
                127.4758141, 34.9697356
            ]);

            /*
            * 바깥 사각형 내부에서
            * 캠퍼스 영역만 구멍으로 제외
            */
            var polygonHierarchy = new Cesium.PolygonHierarchy(
                outsidePositions,
                [
                    new Cesium.PolygonHierarchy(campusPositions)
                ]
            );

            var whiteContextInstance = new Cesium.GeometryInstance({

                id: "SCNU_WHITE_CONTEXT",

                geometry: new Cesium.PolygonGeometry({
                    polygonHierarchy: polygonHierarchy
                }),

                attributes: {
                    color: Cesium.ColorGeometryInstanceAttribute.fromColor(
                        new Cesium.Color(0.30, 0.33, 0.37, 0.68)
                    )
                }
            });

            scene.primitives.add(
                new Cesium.GroundPrimitive({

        function getNearestCampusName(lon, lat, suffix) {

            var clicked =
                Cesium.Cartesian3.fromDegrees(lon, lat);

            var nearestName = null;
            var nearestDistance = Infinity;

            campusBuildingPoints.forEach(function (building) {

                var buildingPosition =
                    Cesium.Cartesian3.fromDegrees(
                        building.lon,
                        building.lat
                    );

                var distance =
                    Cesium.Cartesian3.distance(
                        clicked,
                        buildingPosition
                    );

                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    nearestName = building.name;
                }
            });

            // 건물에서 45m 이내일 때만 건물명 사용
            if (nearestDistance <= 45) {
                return nearestName + " 앞 " + suffix;
            }

            return "교내 " + suffix;
        }

        function setupCampusCamera() {

            if (
                typeof Cesium === "undefined" ||
                typeof ws3d === "undefined" ||
                !ws3d.viewer
            ) {
                return;
            }

            // 중복 실행 방지
            if (window.scnuCampusCameraCreated) {
                return;
            }

            window.scnuCampusCameraCreated = true;

            var viewer = ws3d.viewer;
            var scene = viewer.scene;
            var camera = viewer.camera;
            var controller = scene.screenSpaceCameraController;

            // 너무 가까이 들어가거나 대한민국 전체까지 축소되지 않도록 제한
            controller.minimumZoomDistance = 50;
            controller.maximumZoomDistance = 700;

            // 순천대학교 중심좌표
            var campusCenter = Cesium.Cartesian3.fromDegrees(
                127.4797,
                34.9687,
                0
            );

            // 사용자가 볼 수 있는 범위
            // 순천대학교와 주변 건물 정도를 포함
            var allowedRectangle = Cesium.Rectangle.fromDegrees(
                127.4748,  // 서쪽
                34.9645,   // 남쪽
                127.4855,  // 동쪽
                34.9720    // 북쪽
            );

            var returningToCampus = false;

            function focusCampus() {

                returningToCampus = true;

                camera.lookAt(
                    campusCenter,
                    new Cesium.HeadingPitchRange(
                        Cesium.Math.toRadians(0),    // 방향
                        Cesium.Math.toRadians(-42),  // 기울기
                        850                         // 거리
                    )
                );

                // 일반 카메라 조작 상태로 복귀
                camera.lookAtTransform(
                    Cesium.Matrix4.IDENTITY
                );

                setTimeout(function () {
                    returningToCampus = false;
                }, 200);
            }

            // 처음 실행될 때 학교가 화면에 바로 나타남
            focusCampus();

            // 화면 중심이 허용 구역을 벗어나면 학교로 복귀
            camera.moveEnd.addEventListener(function () {

                if (returningToCampus) {
                    return;
                }

                var centerScreen = new Cesium.Cartesian2(
                    scene.canvas.clientWidth / 2,
                    scene.canvas.clientHeight / 2
                );

                var centerPosition = camera.pickEllipsoid(
                    centerScreen,
                    scene.globe.ellipsoid
                );

                if (!centerPosition) {
                    return;
                }

                var centerCartographic =
                    Cesium.Cartographic.fromCartesian(centerPosition);

                var isInside = Cesium.Rectangle.contains(
                    allowedRectangle,
                    centerCartographic
                );

                if (!isInside) {
                    focusCampus();
                }
            });

            console.log("순천대학교 카메라 범위 제한 완료");
        }

        function updateSystemClock() {
            const now = new Date();

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");

            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");

            document.getElementById("systemClock").innerText =
                `${year}.${month}.${day} ${hours}:${minutes}:${seconds}`;
